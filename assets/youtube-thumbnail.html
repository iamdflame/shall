<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  html,body{margin:0;width:1280px;height:720px;background:#0E1116;overflow:hidden}
  .f{width:100%;height:100%;padding:56px 68px;box-sizing:border-box;
     display:flex;flex-direction:column;gap:0;
     background-image:radial-gradient(circle at 90% 15%,rgba(255,107,74,.11),transparent 55%)}
  .top{display:flex;align-items:center;gap:18px;height:52px}
  .wm{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:28px;
      letter-spacing:.34em;color:#79808F;padding-left:.34em}
  h1{margin:54px 0 0;font-family:'IBM Plex Mono',monospace;font-weight:700;
     font-size:82px;line-height:1.04;color:#E4E7ED;letter-spacing:-.02em}
  h1 em{font-style:normal;color:#FF6B4A}
  .diag{margin-top:52px;font-family:'IBM Plex Mono',monospace;font-size:30px;color:#79808F}
  .diag .u{color:#E4E7ED}
  .split{display:flex;align-items:center;gap:26px;margin-top:26px;
         font-family:'IBM Plex Mono',monospace}
  .n{font-size:78px;font-weight:700;line-height:1;color:#E4E7ED}
  .n.b{color:#FF6B4A}
  .vs{font-size:30px;color:#5A626C}
  .cap{font-size:22px;color:#5A626C;letter-spacing:.04em;margin-left:16px}
</style></head><body>
<div class="f">
  <div class="top">
    <svg viewBox="0 0 64 64" width="44" height="44" fill="none" stroke="#79808F" stroke-width="8" stroke-linecap="round">
      <path d="M 8 20 H 56"/><path d="M 10 40 q 7 -13 14 0 t 14 0 t 12 0"/>
    </svg>
    <div class="wm">SHALL</div>
  </div>

  <h1>SIX AI MODELS.<br>ONE SPEC.<br><em>THREE PROGRAMS.</em></h1>

  <div class="diag">THE SYSTEM SHALL count the <span class="u">words</span> in the text</div>
  <svg width="1100" height="18" viewBox="0 0 1100 18" fill="none" stroke="#FF6B4A" stroke-width="5" stroke-linecap="round" style="margin-top:2px">
    <path d="M 438 11 q 8 -11 16 0 t 16 0 t 16 0 t 16 0"/>
  </svg>

  <div class="split">
    <div class="n">5</div><div class="vs">vs</div><div class="n b">2</div>
    <div class="cap">same input &middot; nobody defined "word"</div>
  </div>
</div>
</body></html>
