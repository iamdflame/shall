<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,300;1,300&display=swap">
<style>
  html,body{margin:0;width:1920px;height:1080px;background:#0E1116;overflow:hidden}
  .frame{width:100%;height:100%;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:0;
         background-image:radial-gradient(circle at 50% 20%,rgba(95,211,176,.05),transparent 60%)}
  .lock{display:flex;align-items:center;gap:44px}
  .word{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:104px;
        letter-spacing:.30em;color:#E4E7ED;line-height:1;padding-left:.30em}
  .tag{font-family:'Spectral',serif;font-weight:300;font-style:italic;
       font-size:44px;color:#79808F;margin-top:56px;letter-spacing:.01em}
  .rule{width:220px;height:1px;background:rgba(228,231,237,.18);margin:64px 0 44px}
  .url{font-family:'IBM Plex Mono',monospace;font-size:30px;color:#5FD3B0;letter-spacing:.06em}
  .foot{font-family:'IBM Plex Mono',monospace;font-size:20px;color:#4A515B;
        letter-spacing:.18em;margin-top:26px;text-transform:uppercase}
</style></head><body>
<div class="frame">
  <div class="lock">
    <svg viewBox="0 0 64 64" width="132" height="132" fill="none" stroke="#E4E7ED" stroke-width="8" stroke-linecap="round">
      <path d="M 8 20 H 56"/><path d="M 10 40 q 7 -13 14 0 t 14 0 t 12 0"/>
    </svg>
    <div class="word">SHALL</div>
  </div>
  <div class="tag">Requirements are the program.</div>
  <div class="rule"></div>
  <div class="url">github.com/iamdflame/shall</div>
  <div class="foot">146 tests · 50/50 criteria verified</div>
</div>
</body></html>
